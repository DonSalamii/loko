<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name='impact-site-verification' value='01b5643b-6bf6-4deb-869d-8ba319220397'>
  <title>LOKO — Szczecin Syndicate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030F0A;
      --gold: #CDAD6A;
      --gold-light: #E8D3A2;
      --gold-glow: rgba(205, 173, 106, 0.35);
      --emerald: #34D399;
      --muted: #7E968B;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(14, 46, 34, 0.7) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(205, 173, 106, 0.05) 0%, transparent 50%);
      color: #F6F3EB;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 24px;
      position: relative;
      overflow: hidden;
    }

    /* Subtelna geometryczna siatka w tle */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(rgba(205, 173, 106, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(205, 173, 106, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 1;
    }

    header {
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .monogram {
      width: 44px;
      height: 44px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 14px;
      color: var(--gold-light);
      background: rgba(4, 20, 14, 0.8);
      box-shadow: 0 0 20px var(--gold-glow);
      letter-spacing: 2px;
    }

    .city-tag {
      font-size: 9px;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 10px;
      font-weight: 600;
    }

    main {
      z-index: 10;
      text-align: center;
      max-width: 680px;
      margin: auto 0;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 30px;
      background: rgba(205, 173, 106, 0.08);
      border: 1px solid rgba(205, 173, 106, 0.25);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 30px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(42px, 8vw, 84px);
      font-weight: 900;
      letter-spacing: 6px;
      line-height: 1.05;
      margin-bottom: 24px;
      background: linear-gradient(180deg, #FFFFFF 20%, #CDAD6A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .tagline {
      font-size: clamp(14px, 1.8vw, 17px);
      color: var(--muted);
      font-weight: 300;
      letter-spacing: 1.5px;
      line-height: 1.8;
      margin-bottom: 40px;
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }

    .invite-box {
      background: rgba(8, 32, 23, 0.75);
      border: 1px solid var(--gold);
      border-radius: 20px;
      padding: 8px 8px 8px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 440px;
      margin: 0 auto 16px auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(205, 173, 106, 0.2);
    }

    .invite-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #F6F3EB;
      font-family: inherit;
      font-size: 14px;
      width: 100%;
    }

    .invite-box input::placeholder {
      color: #4A6659;
    }

    .btn-submit {
      background: linear-gradient(135deg, #CDAD6A 0%, #A8863E 100%);
      color: #04140E;
      border: none;
      padding: 12px 22px;
      border-radius: 14px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s;
      white-space: nowrap;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px var(--gold-glow);
    }

    .micro-note {
      font-size: 11px;
      color: #4A6659;
      letter-spacing: 1px;
    }

    footer {
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      color: #4A6659;
      letter-spacing: 1.5px;
    }

    .coords {
      font-family: monospace;
      color: var(--muted);
      font-size: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="monogram">LK</div>
    <div class="city-tag">SZCZECIN • POLAND</div>
  </header>

  <main>
    <div class="status-pill">
      <div class="pulse-dot"></div>
      Dostęp Wyłącznie Na Zaproszenie
    </div>

    <h1>LOKO</h1>

    <p class="tagline">
      Miasto ma swoje warstwy.<br>
      Tylko nieliczni wiedzą, jak je czytać.
    </p>

    <form class="invite-box" onsubmit="event.preventDefault(); alert('Zgłoszenie zarejestrowane. Powiadomimy Cię, gdy zwolni się miejsce.');">
      <input type="email" placeholder="Wpisz swój e-mail lub kod dostępu..." required>
      <button type="submit" class="btn-submit">Aplikuj</button>
    </form>

    <div class="micro-note">
      Pierwsza pula tokenów prywatnych: Q4 2026
    </div>
  </main>

  <footer>
    <div class="coords">53°25'39.7"N 14°33'18.8"E • ARCHIWUM ZAMKNIĘTE</div>
    <div>&copy; 2026 LOKO SYNDICATE. WSZELKIE PRAWA ZASTRZEŻONE.</div>
  </footer>

</body>
</html>
